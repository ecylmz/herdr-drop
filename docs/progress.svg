<svg xmlns="http://www.w3.org/2000/svg" width="600" height="252" viewBox="0 0 600 252" role="img" aria-label="The upload popup, during transfer and after verification">
  <style>
    .card { fill: #0d1117; stroke: #30363d; rx: 8; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8b949e; }
    .fg { fill: #c9d1d9; }
    .name { fill: #e6edf3; font-weight: 600; }
    .ok { fill: #3fb950; }
    .track { fill: #21262d; }
    .fill { fill: #39c5cf; }
    .label { fill: #8b949e; font-size: 10px; letter-spacing: .08em; }
  </style>

  <text class="label" x="0" y="11">DURING</text>
  <rect class="card" x="0" y="20" width="600" height="96" rx="8"/>
  <text x="20" y="46"><tspan class="name">mid.bin</tspan><tspan class="dim">  2.9 MB</tspan></text>
  <text class="dim" x="20" y="64">→ emrecan@research: /srv/app</text>
  <rect class="track" x="20" y="88" width="196" height="9" rx="4.5"/>
  <rect class="fill" x="20" y="88" width="133" height="9" rx="4.5"/>
  <text class="fg" x="228" y="96">68%  2.0 MB / 2.9 MB  221.4 KB/s  ETA   4s</text>

  <text class="label" x="0" y="147">AFTER</text>
  <rect class="card" x="0" y="156" width="600" height="96" rx="8"/>
  <text x="20" y="182"><tspan class="name">mid.bin</tspan><tspan class="dim">  2.9 MB</tspan></text>
  <text class="dim" x="20" y="200">→ emrecan@research: /srv/app</text>
  <rect class="fill" x="20" y="212" width="196" height="9" rx="4.5"/>
  <text class="fg" x="228" y="220">100%  2.9 MB / 2.9 MB  224.1 KB/s  ETA   0s</text>
  <text x="20" y="240"><tspan class="ok">✓</tspan><tspan class="fg"> 2.9 MB · 13.1 s · 224.1 KB/s · cksum </tspan><tspan class="ok">✓</tspan></text>
</svg>
